version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: infra_dev_password
      POSTGRES_DB: infra_automation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
